server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 66m;
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend api:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
